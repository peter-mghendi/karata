passwords:
  enabled: false
  schemes:
    - version: 1
      algorithm: argon2id
  minimum_complexity: 3
registration:
  enabled: false
  require_email: false
account:
  email_change_allowed: true
  display_name_change_allowed: true
matrix:
  kind: synapse
  homeserver: "{{HOMESERVER_NAME}}"
  secret: "{{MAS_SYNAPSE_SHARED_SECRET}}"
  endpoint: "{{SYNAPSE_INTERNAL_URL}}"
upstream_oauth2:
  providers:
    - id: "C0DE01CAFEBADC0FFEE0DDF00D"
      brand_id: "keycloak"
      display_name: "Sign in with Karata ID"
      issuer: "{{KEYCLOAK_INTERNAL_ISSUER}}"
      authorization_endpoint: "{{KEYCLOAK_EXTERNAL_ISSUER}}/protocol/openid-connect/auth"
      token_endpoint: "{{KEYCLOAK_INTERNAL_ISSUER}}/protocol/openid-connect/token"
      jwks_uri: "{{KEYCLOAK_INTERNAL_ISSUER}}/protocol/openid-connect/certs"
      userinfo_endpoint: "{{KEYCLOAK_INTERNAL_ISSUER}}/protocol/openid-connect/userinfo"
      discovery_mode: "insecure"
      token_endpoint_auth_method: client_secret_basic
      client_id: "mas"
      client_secret: "00000000-0000-0000-0000-000000000000"
      scope: "openid profile email"
      claims_imports:
        localpart:
          action: require
          template: "{{ user.preferred_username }}"
        displayname:
          action: suggest
          template: "{{ user.name }}"
        email:
          action: suggest
          template: "{{ user.email }}"
          set_email_verification: import