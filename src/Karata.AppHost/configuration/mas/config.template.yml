branding:
  service_name: "Karata ID for Matrix"
http:
  listeners:
    - name: web
      resources:
        - name: discovery
        - name: human
        - name: oauth
        - name: compat
        - name: graphql
        - name: assets
      binds:
        - address: '[::]:8080'
      proxy_protocol: false
    - name: internal
      resources:
        - name: health
      binds:
        - address: '[::]:8081'
      proxy_protocol: false
  trusted_proxies:
    - 192.168.0.0/16
    - 172.16.0.0/12
    - 10.0.0.0/10
    - 127.0.0.1/8
    - fd00::/8
    - ::1/128
  public_base: "{{MAS_PUBLIC_BASE}}"
  issuer: "{{MAS_PUBLIC_BASE}}"
database:
  uri: "{{DATABASE_URL}}"
  max_connections: 10
  min_connections: 0
  connect_timeout: 30
  idle_timeout: 600
  max_lifetime: 1800
email:
  from: '"Karata ID for Matrix" <id@localhost>'
  reply_to: '"Karata ID for Matrix" <id@localhost>'
  transport: blackhole
